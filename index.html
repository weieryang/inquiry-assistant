<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>询盘回复助手 - DeepSeek V4 Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .version {
            font-size: 11px;
            background: rgba(255,255,255,0.15);
            padding: 3px 8px;
            border-radius: 10px;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .api-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; opacity: 0.8;
        }
        .api-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ff4444;
        }
        .api-dot.connected { background: #4caf50; }

        /* Layout */
        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: #1a1a2e;
            color: #ccc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-section {
            padding: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
        }
        .session-input-row {
            display: flex;
            gap: 6px;
        }
        .session-input-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 13px;
        }
        .session-input-row input::placeholder { color: #666; }
        .session-input-row button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #1a73e8;
            color: white;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .session-input-row button:hover { background: #1557b0; }
        .btn-new-session {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 6px;
            background: transparent;
            color: #aaa;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-new-session:hover { border-color: #1a73e8; color: #1a73e8; }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .session-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
            position: relative;
        }
        .session-item:hover { background: rgba(255,255,255,0.08); }
        .session-item.active { background: #1a73e8; color: white; }
        .session-item .session-id {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .session-item .session-meta {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 3px;
        }
        .session-item .session-delete {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,0,0,0.6);
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: none;
        }
        .session-item:hover .session-delete { display: block; }

        /* Settings Panel */
        .settings-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .settings-row label {
            font-size: 12px;
            color: #888;
            width: 60px;
            flex-shrink: 0;
            line-height: 28px;
        }
        .settings-row select, .settings-row input {
            flex: 1;
            padding: 6px 8px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 12px;
        }
        .settings-row select option { background: #1a1a2e; color: white; }

        /* Knowledge Base */
        .kb-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .kb-btn {
            flex: 1;
            padding: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            background: transparent;
            color: #aaa;
            font-size: 11px;
            cursor: pointer;
        }
        .kb-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .kb-list {
            max-height: 120px;
            overflow-y: auto;
        }
        .kb-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 4px;
            margin-bottom: 2px;
        }
        .kb-item:hover { background: rgba(255,255,255,0.05); }
        .kb-item .kb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kb-item .kb-size { color: #666; font-size: 11px; margin: 0 8px; }
        .kb-item .kb-del {
            background: none; border: none; color: #ff6666;
            cursor: pointer; font-size: 14px; padding: 0 4px;
        }

        /* Main Chat Area */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* Chat Header */
        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
        }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .current-customer {
            font-size: 15px;
            font-weight: 600;
        }
        .chat-header .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-alibaba { background: #fff3e0; color: #e65100; }
        .badge-mic { background: #e8f5e9; color: #2e7d32; }
        .badge-1688 { background: #fce4ec; color: #c62828; }
        .chat-header-right { display: flex; gap: 8px; }
        .header-btn {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 12px;
            cursor: pointer;
        }
        .header-btn:hover { background: #f5f5f5; }

        /* Messages */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            max-width: 80%;
            margin-bottom: 16px;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
        .message.user { margin-left: auto; }
        .message.assistant { margin-right: auto; }
        .message.system {
            max-width: 100%;
            text-align: center;
            margin: 10px auto;
        }
        .msg-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
        }
        .message.user .msg-label { text-align: right; }
        .msg-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .message.user .msg-bubble {
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .msg-bubble {
            background: #f1f3f4;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        .message.system .msg-bubble {
            background: #fff8e1;
            color: #f57f17;
            font-size: 12px;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Analysis Card */
        .analysis-card {
            background: #f0f7ff;
            border: 1px solid #d0e3f7;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .analysis-card h4 { color: #1a73e8; font-size: 12px; margin-bottom: 6px; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin: 2px 3px;
            font-weight: 500;
        }
        .tag-lang { background: #e8f5e9; color: #2e7d32; }
        .tag-intent { background: #fff3e0; color: #e65100; }
        .tag-qty { background: #f3e5f5; color: #7b1fa2; }
        .tag-urgency { background: #fce4ec; color: #c62828; }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e8e8e8;
            background: #fafafa;
        }
        .input-tools {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 4px 10px;
            border: 1px solid #ddd;
            border-radius: 16px;
            background: white;
            font-size: 11px;
            cursor: pointer;
            color: #555;
        }
        .tool-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .tool-btn.active { background: #1a73e8; color: white; border-color: #1a73e8; }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .input-row textarea {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
            resize: none;
            height: 60px;
            font-family: inherit;
        }
        .input-row textarea:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }
        .send-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            height: 60px;
            min-width: 80px;
        }
        .send-btn:hover { background: #1557b0; }
        .send-btn:disabled { background: #94baf7; cursor: not-allowed; }

        /* Loading */
        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: #f1f3f4;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            max-width: 60px;
            margin-bottom: 16px;
        }
        .typing-indicator.show { display: block; }
        .typing-dots span {
            display: inline-block;
            width: 6px; height: 6px;
            background: #999;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: white;
            border-radius: 12px;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal h3 { margin-bottom: 16px; font-size: 16px; }
        .modal textarea {
            width: 100%;
            height: 300px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-family: inherit;
            line-height: 1.6;
            resize: vertical;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }
        .modal-btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid #ddd;
            background: white;
        }
        .modal-btn.primary { background: #1a73e8; color: white; border-color: #1a73e8; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            z-index: 2000;
        }
        .toast.show { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:12px;">
            <h1>询盘回复助手</h1>
            <span class="version">DeepSeek V4 Pro</span>
        </div>
        <div class="header-right">
            <div class="api-status">
                <div class="api-dot" id="apiDot"></div>
                <span id="apiStatusText">检查中...</span>
            </div>
        </div>
    </div>

    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Customer Session -->
            <div class="sidebar-section">
                <h3>客户会话</h3>
                <div class="session-input-row">
                    <input type="text" id="customerIdInput" placeholder="客户ID (如: dubai-hotel-001)">
                    <button onclick="switchSession()">切换</button>
                </div>
                <button class="btn-new-session" onclick="createNewSession()">+ 新建会话</button>
            </div>

            <!-- Session List -->
            <div class="session-list" id="sessionList">
                <div style="text-align:center; color:#555; font-size:12px; padding:20px;">暂无会话</div>
            </div>

            <!-- Settings -->
            <div class="sidebar-section">
                <h3>回复设置</h3>
                <div class="settings-row">
                    <label>平台</label>
                    <select id="platform">
                        <option value="alibaba">国际站</option>
                        <option value="mic">中国制造网</option>
                        <option value="1688">1688</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label>语言</label>
                    <select id="replyLang">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="pt">Português</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="tr">Türkçe</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label>语气</label>
                    <select id="tone">
                        <option value="professional">专业商务</option>
                        <option value="friendly">热情友好</option>
                        <option value="concise">简洁高效</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label>模型</label>
                    <select id="modelSelect">
                        <option value="flash">V4-Flash (省钱)</option>
                        <option value="pro">V4-Pro (高质量)</option>
                    </select>
                </div>
                <div class="settings-row">
                    <label>价格</label>
                    <input type="text" id="priceRange" placeholder="如: $5-15/件">
                </div>
            </div>

            <!-- Knowledge Base -->
            <div class="sidebar-section">
                <h3>知识库</h3>
                <div class="kb-actions">
                    <button class="kb-btn" onclick="showUploadKB()">上传文件</button>
                    <button class="kb-btn" onclick="showCreateKB()">新建文档</button>
                    <button class="kb-btn" onclick="refreshKB()">刷新</button>
                </div>
                <div class="kb-list" id="kbList">
                    <div style="text-align:center; color:#555; font-size:11px; padding:10px;">暂无知识库文件</div>
                </div>
            </div>
        </div>

        <!-- Main Chat -->
        <div class="main-area">
            <div class="chat-header">
                <div class="chat-header-left">
                    <span class="current-customer" id="currentCustomerLabel">未选择客户</span>
                    <span class="badge badge-alibaba" id="platformBadge">国际站</span>
                </div>
                <div class="chat-header-right">
                    <button class="header-btn" onclick="copyLastReply()">复制回复</button>
                    <button class="header-btn" onclick="clearCurrentSession()">清除会话</button>
                    <button class="header-btn" onclick="exportChat()">导出记录</button>
                </div>
            </div>

            <div class="messages" id="messagesArea">
                <div class="message system">
                    <div class="msg-bubble">👋 选择或创建一个客户会话，每个客户独立对话，互不干扰</div>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="input-area">
                <div class="input-tools">
                    <button class="tool-btn" onclick="quickAction('payment')">付款方式</button>
                    <button class="tool-btn" onclick="quickAction('shipping')">物流方案</button>
                    <button class="tool-btn" onclick="quickAction('sample')">寄样</button>
                    <button class="tool-btn" onclick="quickAction('moq')">起订量</button>
                    <button class="tool-btn" onclick="quickAction('oem')">OEM/ODM</button>
                    <button class="tool-btn" onclick="quickAction('catalog')">发目录</button>
                </div>
                <div class="input-row">
                    <textarea id="inputArea" placeholder="粘贴买家询盘内容，或输入你想问的问题...&#10;支持 Ctrl+Enter 发送" onkeydown="handleKeydown(event)"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload KB Modal -->
    <div class="modal-overlay" id="uploadKBModal">
        <div class="modal">
            <h3>上传知识库文件</h3>
            <p style="font-size:13px; color:#888; margin-bottom:12px;">支持 .txt 和 .md 格式，建议内容为产品信息、FAQ、公司介绍等</p>
            <input type="file" id="kbFileInput" accept=".txt,.md" style="margin-bottom:12px;">
            <div style="font-size:12px; color:#888; margin-bottom:12px;">或直接粘贴内容:</div>
            <textarea id="kbContentInput" placeholder="粘贴知识库内容..."></textarea>
            <input type="text" id="kbFilenameInput" placeholder="文件名 (如: products.txt)" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:6px; margin-top:8px; font-size:13px;">
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeModal('uploadKBModal')">取消</button>
                <button class="modal-btn primary" onclick="uploadKB()">保存</button>
            </div>
        </div>
    </div>

    <!-- Create KB Modal -->
    <div class="modal-overlay" id="createKBModal">
        <div class="modal">
            <h3>新建知识库文档</h3>
            <p style="font-size:13px; color:#888; margin-bottom:12px;">为每个客户/产品线创建独立的知识库文档</p>
            <input type="text" id="newKBName" placeholder="文档名 (如: ceramic-tiles.txt)" style="width:100%; padding:8px 12px; border:1px solid #ddd; border-radius:6px; margin-bottom:12px; font-size:13px;">
            <textarea id="newKBContent" placeholder="输入知识库内容，例如：&#10;&#10;产品: 陶瓷地板砖&#10;规格: 600x600mm, 800x800mm&#10;价格: FOB $5-12/件&#10;MOQ: 500㎡&#10;交期: 15-20天&#10;认证: CE, ISO9001&#10;&#10;常见问题:&#10;Q: 能否做OEM?&#10;A: 可以，支持定制尺寸、花色、包装"></textarea>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeModal('createKBModal')">取消</button>
                <button class="modal-btn primary" onclick="createKB()">创建</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = window.location.origin;
        let currentCustomerId = '';
        let currentSession = { messages: [] };
        let allSessions = {};
        let kbFiles = [];

        // ===== Init =====
        checkAPIStatus();
        loadSessions();
        refreshKB();

        setInterval(checkAPIStatus, 30000);

        // ===== API Status =====
        async function checkAPIStatus() {
            try {
                const res = await fetch(`${API_BASE}/api/sessions`);
                if (res.ok) {
                    document.getElementById('apiDot').classList.add('connected');
                    document.getElementById('apiStatusText').textContent = '已连接';
                } else {
                    throw new Error();
                }
            } catch {
                document.getElementById('apiDot').classList.remove('connected');
                document.getElementById('apiStatusText').textContent = '未连接';
            }
        }

        // ===== Session Management =====
        async function loadSessions() {
            try {
                const res = await fetch(`${API_BASE}/api/sessions`);
                const sessions = await res.json();
                renderSessionList(sessions);
            } catch (err) {
                console.error('Failed to load sessions:', err);
            }
        }

        function renderSessionList(sessions) {
            const list = document.getElementById('sessionList');
            if (sessions.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#555; font-size:12px; padding:20px;">暂无会话</div>';
                return;
            }
            list.innerHTML = sessions.map(s => `
                <div class="session-item ${s.customerId === currentCustomerId ? 'active' : ''}"
                     onclick="switchToSession('${s.customerId}')">
                    <div class="session-id">${s.customerId}</div>
                    <div class="session-meta">${s.messageCount}条消息 · ${s.lastActivity ? timeAgo(s.lastActivity) : ''}</div>
                    <button class="session-delete" onclick="event.stopPropagation(); deleteSession('${s.customerId}')">✕</button>
                </div>
            `).join('');
        }

        function createNewSession() {
            const input = document.getElementById('customerIdInput');
            let id = input.value.trim();
            if (!id) {
                id = 'customer-' + Date.now().toString(36);
                input.value = id;
            }
            switchToSession(id);
        }

        function switchSession() {
            const id = document.getElementById('customerIdInput').value.trim();
            if (!id) { showToast('请输入客户ID'); return; }
            switchToSession(id);
        }

        async function switchToSession(customerId) {
            currentCustomerId = customerId;
            document.getElementById('customerIdInput').value = customerId;
            document.getElementById('currentCustomerLabel').textContent = customerId;

            try {
                const res = await fetch(`${API_BASE}/api/session/${encodeURIComponent(customerId)}`);
                currentSession = await res.json();
            } catch {
                currentSession = { customerId, messages: [] };
            }

            renderMessages();
            loadSessions();
        }

        async function deleteSession(customerId) {
            if (!confirm(`确定删除客户 ${customerId} 的会话？`)) return;
            try {
                await fetch(`${API_BASE}/api/session/${encodeURIComponent(customerId)}`, { method: 'DELETE' });
                if (customerId === currentCustomerId) {
                    currentCustomerId = '';
                    currentSession = { messages: [] };
                    document.getElementById('currentCustomerLabel').textContent = '未选择客户';
                    renderMessages();
                }
                loadSessions();
                showToast('会话已删除');
            } catch (err) {
                showToast('删除失败');
            }
        }

        async function clearCurrentSession() {
            if (!currentCustomerId) { showToast('请先选择客户'); return; }
            if (!confirm(`确定清除 ${currentCustomerId} 的所有对话记录？`)) return;
            await deleteSession(currentCustomerId);
        }

        // ===== Message Rendering =====
        function renderMessages() {
            const area = document.getElementById('messagesArea');
            if (!currentSession.messages || currentSession.messages.length === 0) {
                area.innerHTML = `
                    <div class="message system">
                        <div class="msg-bubble">💬 在下方输入框粘贴买家询盘，AI将为 <strong>${currentCustomerId}</strong> 生成专业回复</div>
                    </div>`;
                return;
            }

            area.innerHTML = currentSession.messages.map(msg => {
                if (msg.role === 'system') return '';
                const label = msg.role === 'user' ? '买家询盘 / 我的问题' : 'AI回复';
                return `
                    <div class="message ${msg.role}">
                        <div class="msg-label">${label}</div>
                        <div class="msg-bubble">${escapeHtml(msg.content)}</div>
                    </div>`;
            }).join('');

            area.scrollTop = area.scrollHeight;
        }

        // ===== Send Message =====
        async function sendMessage() {
            const input = document.getElementById('inputArea');
            const text = input.value.trim();
            if (!text) return;
            if (!currentCustomerId) { showToast('请先选择或创建客户会话'); return; }

            // Add user message
            currentSession.messages.push({ role: 'user', content: text });
            renderMessages();
            input.value = '';

            // Show typing
            const typing = document.getElementById('typingIndicator');
            typing.classList.add('show');
            document.getElementById('sendBtn').disabled = true;

            try {
                const res = await fetch(`${API_BASE}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerId: currentCustomerId,
                        inquiry: text,
                        platform: document.getElementById('platform').value,
                        lang: document.getElementById('replyLang').value,
                        tone: document.getElementById('tone').value,
                        priceRange: document.getElementById('priceRange').value,
                        model: document.getElementById('modelSelect').value
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    currentSession.messages.push({ role: 'assistant', content: data.reply });
                    renderMessages();
                    loadSessions();
                } else {
                    showToast('生成失败: ' + (data.error || '未知错误'));
                    currentSession.messages.pop();
                    renderMessages();
                }
            } catch (err) {
                showToast('连接失败: ' + err.message);
                currentSession.messages.pop();
                renderMessages();
            } finally {
                typing.classList.remove('show');
                document.getElementById('sendBtn').disabled = false;
            }
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        // ===== Quick Actions =====
        function quickAction(type) {
            if (!currentCustomerId) { showToast('请先选择客户'); return; }
            const prompts = {
                payment: '请帮我用专业的方式回复买家关于付款方式的询问，包括T/T、L/C、Trade Assurance等',
                shipping: '请帮我回复买家关于物流方案的问题，包括FOB/CIF/DDP条款，海运/空运/快递的时间和费用',
                sample: '请帮我回复买家关于寄样的问题，包括样品费用、寄送方式、是否可退等',
                moq: '请帮我回复买家关于起订量的问题，包括首次合作的灵活政策和阶梯价格',
                oem: '请帮我回复买家关于OEM/ODM定制的问题，包括可定制范围、起订量、费用等',
                catalog: '请帮我回复买家索要产品目录的请求，告知将发送最新产品目录'
            };
            document.getElementById('inputArea').value = prompts[type] || '';
            document.getElementById('inputArea').focus();
        }

        // ===== Knowledge Base =====
        async function refreshKB() {
            try {
                const res = await fetch(`${API_BASE}/api/knowledge`);
                kbFiles = await res.json();
                renderKBList();
            } catch (err) {
                console.error('Failed to load KB:', err);
            }
        }

        function renderKBList() {
            const list = document.getElementById('kbList');
            if (kbFiles.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#555; font-size:11px; padding:10px;">暂无知识库文件</div>';
                return;
            }
            list.innerHTML = kbFiles.map(f => `
                <div class="kb-item">
                    <span class="kb-name" title="${f.name}">📄 ${f.name}</span>
                    <span class="kb-size">${(f.size/1024).toFixed(1)}KB</span>
                    <button class="kb-del" onclick="deleteKB('${f.name}')">✕</button>
                </div>
            `).join('');
        }

        function showUploadKB() { document.getElementById('uploadKBModal').classList.add('show'); }
        function showCreateKB() { document.getElementById('createKBModal').classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        async function uploadKB() {
            const fileInput = document.getElementById('kbFileInput');
            const contentInput = document.getElementById('kbContentInput');
            const nameInput = document.getElementById('kbFilenameInput');

            let filename = nameInput.value.trim();
            let content = contentInput.value.trim();

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                filename = filename || file.name;
                content = await file.text();
            }

            if (!filename || !content) { showToast('请提供文件名和内容'); return; }

            try {
                await fetch(`${API_BASE}/api/knowledge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, content })
                });
                closeModal('uploadKBModal');
                document.getElementById('kbFileInput').value = '';
                document.getElementById('kbContentInput').value = '';
                document.getElementById('kbFilenameInput').value = '';
                refreshKB();
                showToast('知识库已更新');
            } catch (err) {
                showToast('上传失败');
            }
        }

        async function createKB() {
            const name = document.getElementById('newKBName').value.trim();
            const content = document.getElementById('newKBContent').value.trim();
            if (!name || !content) { showToast('请填写文件名和内容'); return; }

            try {
                await fetch(`${API_BASE}/api/knowledge`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: name, content })
                });
                closeModal('createKBModal');
                document.getElementById('newKBName').value = '';
                document.getElementById('newKBContent').value = '';
                refreshKB();
                showToast('文档已创建');
            } catch (err) {
                showToast('创建失败');
            }
        }

        async function deleteKB(filename) {
            if (!confirm(`确定删除 ${filename}？`)) return;
            try {
                await fetch(`${API_BASE}/api/knowledge/${encodeURIComponent(filename)}`, { method: 'DELETE' });
                refreshKB();
                showToast('已删除');
            } catch (err) {
                showToast('删除失败');
            }
        }

        // ===== Utility =====
        function copyLastReply() {
            const msgs = currentSession.messages.filter(m => m.role === 'assistant');
            if (msgs.length === 0) { showToast('没有可复制的回复'); return; }
            navigator.clipboard.writeText(msgs[msgs.length - 1].content).then(() => showToast('已复制'));
        }

        function exportChat() {
            if (!currentCustomerId || currentSession.messages.length === 0) {
                showToast('没有可导出的记录'); return;
            }
            const text = currentSession.messages.map(m =>
                `【${m.role === 'user' ? '买家' : 'AI回复'}】\n${m.content}\n`
            ).join('\n' + '='.repeat(50) + '\n\n');
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${currentCustomerId}_对话记录.txt`;
            a.click();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function timeAgo(dateStr) {
            const diff = Date.now() - new Date(dateStr).getTime();
            const mins = Math.floor(diff / 60000);
            if (mins < 1) return '刚刚';
            if (mins < 60) return mins + '分钟前';
            const hours = Math.floor(mins / 60);
            if (hours < 24) return hours + '小时前';
            return Math.floor(hours / 24) + '天前';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
