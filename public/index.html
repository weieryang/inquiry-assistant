<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>璇㈢洏鍥炲鍔╂墜 - DeepSeek V4</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .header h1 { font-size: 18px; }
        .header .ver { font-size: 11px; background: rgba(255,255,255,0.15); padding: 3px 8px; border-radius: 10px; }
        .app { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #1a1a2e; color: #ccc; display: flex; flex-direction: column; flex-shrink: 0; }
        .sb-section { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sb-section h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; }
        .sb-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .sb-row label { font-size: 12px; color: #888; width: 55px; flex-shrink: 0; line-height: 28px; }
        .sb-row select, .sb-row input { flex: 1; padding: 6px 8px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: rgba(255,255,255,0.08); color: white; font-size: 12px; }
        .sb-row select option { background: #1a1a2e; }
        .session-input { display: flex; gap: 6px; }
        .session-input input { flex: 1; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: rgba(255,255,255,0.08); color: white; font-size: 13px; }
        .session-input input::placeholder { color: #666; }
        .session-input button { padding: 8px 12px; border: none; border-radius: 6px; background: #1a73e8; color: white; font-size: 12px; cursor: pointer; }
        .new-session-btn { width: 100%; padding: 8px; margin-top: 8px; border: 1px dashed rgba(255,255,255,0.2); border-radius: 6px; background: transparent; color: #aaa; font-size: 12px; cursor: pointer; }
        .new-session-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .session-list { flex: 1; overflow-y: auto; padding: 8px; }
        .session-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; position: relative; }
        .session-item:hover { background: rgba(255,255,255,0.08); }
        .session-item.active { background: #1a73e8; color: white; }
        .session-item .sid { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .session-item .smeta { font-size: 11px; opacity: 0.6; margin-top: 3px; }
        .session-item .sdel { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(255,0,0,0.6); color: white; border: none; width: 20px; height: 20px; border-radius: 4px; font-size: 11px; cursor: pointer; display: none; }
        .session-item:hover .sdel { display: block; }
        .kb-actions { display: flex; gap: 6px; margin-bottom: 8px; }
        .kb-btn { flex: 1; padding: 6px; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; background: transparent; color: #aaa; font-size: 11px; cursor: pointer; }
        .kb-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .kb-list { max-height: 120px; overflow-y: auto; }
        .kb-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 2px; }
        .kb-item:hover { background: rgba(255,255,255,0.05); }
        .kb-item .kname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kb-item .ksize { color: #666; font-size: 11px; margin: 0 8px; }
        .kb-item .kdel { background: none; border: none; color: #ff6666; cursor: pointer; font-size: 14px; }
        .main { flex: 1; display: flex; flex-direction: column; background: white; }
        .chat-header { padding: 12px 20px; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; background: #fafafa; }
        .chat-header .cc { font-size: 15px; font-weight: 600; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-alibaba { background: #fff3e0; color: #e65100; }
        .badge-mic { background: #e8f5e9; color: #2e7d32; }
        .badge-1688 { background: #fce4ec; color: #c62828; }
        .chat-hdr-btns { display: flex; gap: 8px; }
        .hdr-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 12px; cursor: pointer; }
        .hdr-btn:hover { background: #f5f5f5; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { max-width: 80%; margin-bottom: 16px; animation: msgIn 0.25s ease; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
        .msg.user { margin-left: auto; }
        .msg.assistant { margin-right: auto; }
        .msg.system { max-width: 100%; text-align: center; margin: 10px auto; }
        .msg-label { font-size: 11px; color: #999; margin-bottom: 4px; }
        .msg.user .msg-label { text-align: right; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .msg.user .msg-bubble { background: #1a73e8; color: white; border-bottom-right-radius: 4px; }
        .msg.assistant .msg-bubble { background: #f1f3f4; color: #333; border-bottom-left-radius: 4px; }
        .msg.system .msg-bubble { background: #fff8e1; color: #f57f17; font-size: 12px; display: inline-block; padding: 6px 14px; border-radius: 20px; }
        .typing { display: none; padding: 12px 16px; background: #f1f3f4; border-radius: 12px; border-bottom-left-radius: 4px; max-width: 60px; margin-bottom: 16px; }
        .typing.show { display: block; }
        .dots span { display: inline-block; width: 6px; height: 6px; background: #999; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite; }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .input-area { padding: 16px 20px; border-top: 1px solid #e8e8e8; background: #fafafa; }
        .input-tools { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .tool-btn { padding: 4px 10px; border: 1px solid #ddd; border-radius: 16px; background: white; font-size: 11px; cursor: pointer; color: #555; }
        .tool-btn:hover { border-color: #1a73e8; color: #1a73e8; }
        .input-row { display: flex; gap: 10px; align-items: flex-end; }
        .input-row textarea { flex: 1; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; line-height: 1.5; resize: none; height: 60px; font-family: inherit; }
        .input-row textarea:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .send-btn { padding: 12px 24px; border: none; border-radius: 10px; background: #1a73e8; color: white; font-size: 14px; font-weight: 600; cursor: pointer; height: 60px; min-width: 80px; }
        .send-btn:hover { background: #1557b0; }
        .send-btn:disabled { background: #94baf7; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: white; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; padding: 24px; }
        .modal h3 { margin-bottom: 16px; font-size: 16px; }
        .modal textarea { width: 100%; height: 300px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 13px; font-family: inherit; line-height: 1.6; resize: vertical; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .modal-btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; cursor: pointer; border: 1px solid #ddd; background: white; }
        .modal-btn.primary { background: #1a73e8; color: white; border-color: #1a73e8; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; display: none; z-index: 2000; }
        .toast.show { display: block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
        @media (max-width: 900px) { .sidebar { display: none; } }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; align-items:center; gap:12px;">
            <h1>璇㈢洏鍥炲鍔╂墜</h1>
            <span class="ver">DeepSeek V4</span>
        </div>
        <div style="font-size:12px; opacity:0.7;">鍦ㄧ嚎鐗?/div>
    </div>
    <div class="app">
        <div class="sidebar">
            <div class="sb-section">
                <h3>瀹㈡埛浼氳瘽</h3>
                <div class="session-input">
                    <input type="text" id="customerIdInput" placeholder="瀹㈡埛ID (濡? dubai-hotel-001)">
                    <button onclick="switchSession()">鍒囨崲</button>
                </div>
                <button class="new-session-btn" onclick="createNewSession()">+ 鏂板缓浼氳瘽</button>
            </div>
            <div class="session-list" id="sessionList">
                <div style="text-align:center; color:#555; font-size:12px; padding:20px;">鏆傛棤浼氳瘽</div>
            </div>
            <div class="sb-section">
                <h3>鍥炲璁剧疆</h3>
                <div class="sb-row"><label>骞冲彴</label><select id="platform"><option value="alibaba">鍥介檯绔?/option><option value="mic">涓浗鍒堕€犵綉</option><option value="1688">1688</option></select></div>
                <div class="sb-row"><label>璇█</label><select id="replyLang"><option value="en">English</option><option value="es">Espa帽ol</option><option value="ru">袪褍褋褋泻懈泄</option><option value="ar">丕賱毓乇亘賷丞</option><option value="pt">Portugu锚s</option><option value="fr">Fran莽ais</option><option value="de">Deutsch</option><option value="tr">T眉rk莽e</option></select></div>
                <div class="sb-row"><label>璇皵</label><select id="tone"><option value="professional">涓撲笟鍟嗗姟</option><option value="friendly">鐑儏鍙嬪ソ</option><option value="concise">绠€娲侀珮鏁?/option></select></div>
                <div class="sb-row"><label>妯″瀷</label><select id="modelSelect"><option value="flash">V4-Flash (鐪侀挶)</option><option value="pro">V4-Pro (楂樿川閲?</option></select></div>
                <div class="sb-row"><label>浠锋牸</label><input type="text" id="priceRange" placeholder="濡? $5-15/浠?></div>
            </div>
            <div class="sb-section">
                <h3>鐭ヨ瘑搴?/h3>
                <div class="kb-actions">
                    <button class="kb-btn" onclick="showUploadKB()">涓婁紶鏂囦欢</button>
                    <button class="kb-btn" onclick="showCreateKB()">鏂板缓鏂囨。</button>
                </div>
                <div class="kb-list" id="kbList"></div>
            </div>
        </div>
        <div class="main">
            <div class="chat-header">
                <div style="display:flex; align-items:center; gap:12px;">
                    <span class="cc" id="currentCustomerLabel">鏈€夋嫨瀹㈡埛</span>
                    <span class="badge badge-alibaba" id="platformBadge">鍥介檯绔?/span>
                </div>
                <div class="chat-hdr-btns">
                    <button class="hdr-btn" onclick="copyLastReply()">澶嶅埗鍥炲</button>
                    <button class="hdr-btn" onclick="clearCurrentSession()">娓呴櫎浼氳瘽</button>
                </div>
            </div>
            <div class="messages" id="messagesArea">
                <div class="message system"><div class="msg-bubble">閫夋嫨鎴栧垱寤轰竴涓鎴蜂細璇濓紝姣忎釜瀹㈡埛鐙珛瀵硅瘽</div></div>
            </div>
            <div class="typing" id="typingIndicator"><div class="dots"><span></span><span></span><span></span></div></div>
            <div class="input-area">
                <div class="input-tools">
                    <button class="tool-btn" onclick="quickAction('payment')">浠樻鏂瑰紡</button>
                    <button class="tool-btn" onclick="quickAction('shipping')">鐗╂祦鏂规</button>
                    <button class="tool-btn" onclick="quickAction('sample')">瀵勬牱</button>
                    <button class="tool-btn" onclick="quickAction('moq')">璧疯閲?/button>
                    <button class="tool-btn" onclick="quickAction('oem')">OEM/ODM</button>
                </div>
                <div class="input-row">
                    <textarea id="inputArea" placeholder="绮樿创涔板璇㈢洏鍐呭... (Ctrl+Enter 鍙戦€?" onkeydown="if(event.key==='Enter'&&event.ctrlKey){event.preventDefault();sendMessage();}"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">鍙戦€?/button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="uploadKBModal"><div class="modal"><h3>涓婁紶鐭ヨ瘑搴撴枃浠?/h3><input type="file" id="kbFileInput" accept=".txt,.md" style="margin-bottom:12px;"><textarea id="kbContentInput" placeholder="鎴栫矘璐村唴瀹?.."></textarea><input type="text" id="kbFilenameInput" placeholder="鏂囦欢鍚? style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;margin-top:8px;font-size:13px;"><div class="modal-actions"><button class="modal-btn" onclick="closeModal('uploadKBModal')">鍙栨秷</button><button class="modal-btn primary" onclick="uploadKB()">淇濆瓨</button></div></div></div>
    <div class="modal-overlay" id="createKBModal"><div class="modal"><h3>鏂板缓鐭ヨ瘑搴撴枃妗?/h3><input type="text" id="newKBName" placeholder="鏂囨。鍚? style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;margin-bottom:12px;font-size:13px;"><textarea id="newKBContent" placeholder="杈撳叆鐭ヨ瘑搴撳唴瀹?.."></textarea><div class="modal-actions"><button class="modal-btn" onclick="closeModal('createKBModal')">鍙栨秷</button><button class="modal-btn primary" onclick="createKB()">鍒涘缓</button></div></div></div>
    <div class="toast" id="toast"></div>
    <script>
        let currentCustomerId='';
        let currentSession={messages:[]};
        let kbFiles=JSON.parse(localStorage.getItem('kb_files')||'[]');

        renderKBList();

        function getSessions(){return JSON.parse(localStorage.getItem('inquiry_sessions')||'{}');}
        function saveSessions(s){localStorage.setItem('inquiry_sessions',JSON.stringify(s));}
        function getKBContent(){return kbFiles.map(f=>`--- ${f.name} ---\n${f.content}`).join('\n');}

        function renderSessionList(){
            const s=getSessions();const list=document.getElementById('sessionList');
            const keys=Object.keys(s);
            if(!keys.length){list.innerHTML='<div style="text-align:center;color:#555;font-size:12px;padding:20px;">鏆傛棤浼氳瘽</div>';return;}
            list.innerHTML=keys.map(k=>`<div class="session-item ${k===currentCustomerId?'active':''}" onclick="switchToSession('${k}')"><div class="sid">${k}</div><div class="smeta">${s[k].messages.length}鏉℃秷鎭?/div><button class="sdel" onclick="event.stopPropagation();deleteSession('${k}')">鉁?/button></div>`).join('');
        }

        function createNewSession(){
            let id=document.getElementById('customerIdInput').value.trim();
            if(!id){id='customer-'+Date.now().toString(36);document.getElementById('customerIdInput').value=id;}
            switchToSession(id);
        }
        function switchSession(){const id=document.getElementById('customerIdInput').value.trim();if(!id){toast('璇疯緭鍏ュ鎴稩D');return;}switchToSession(id);}
        function switchToSession(id){
            currentCustomerId=id;document.getElementById('customerIdInput').value=id;
            document.getElementById('currentCustomerLabel').textContent=id;
            const s=getSessions();currentSession=s[id]||{messages:[]};renderMessages();renderSessionList();
        }
        function deleteSession(id){if(!confirm('纭畾鍒犻櫎锛?))return;const s=getSessions();delete s[id);saveSessions(s);if(id===currentCustomerId){currentCustomerId='';currentSession={messages:[]};document.getElementById('currentCustomerLabel').textContent='鏈€夋嫨瀹㈡埛';renderMessages();}renderSessionList();}
        function clearCurrentSession(){if(!currentCustomerId){toast('璇峰厛閫夋嫨瀹㈡埛');return;}deleteSession(currentCustomerId);}

        function renderMessages(){
            const area=document.getElementById('messagesArea');
            if(!currentSession.messages.length){area.innerHTML='<div class="message system"><div class="msg-bubble">鍦ㄤ笅鏂硅緭鍏ユ绮樿创涔板璇㈢洏锛孉I灏嗙敓鎴愪笓涓氬洖澶?/div></div>';return;}
            area.innerHTML=currentSession.messages.map(m=>{
                if(m.role==='system')return'';
                return`<div class="msg ${m.role}"><div class="msg-label">${m.role==='user'?'涔板璇㈢洏':'AI鍥炲'}</div><div class="msg-bubble">${esc(m.content)}</div></div>`;
            }).join('');
            area.scrollTop=area.scrollHeight;
        }

        async function sendMessage(){
            const input=document.getElementById('inputArea');const text=input.value.trim();
            if(!text)return;if(!currentCustomerId){toast('璇峰厛閫夋嫨瀹㈡埛');return;}
            currentSession.messages.push({role:'user',content:text});renderMessages();input.value='';
            document.getElementById('typingIndicator').classList.add('show');document.getElementById('sendBtn').disabled=true;
            try{
                const res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({customerId:currentCustomerId,inquiry:text,platform:document.getElementById('platform').value,lang:document.getElementById('replyLang').value,tone:document.getElementById('tone').value,priceRange:document.getElementById('priceRange').value,model:document.getElementById('modelSelect').value,knowledgeBase:getKBContent()})});
                const data=await res.json();
                if(res.ok){currentSession.messages.push({role:'assistant',content:data.reply});const s=getSessions();s[currentCustomerId]=currentSession;saveSessions(s);renderMessages();renderSessionList();}
                else{toast('鐢熸垚澶辫触: '+(data.error||''));currentSession.messages.pop();renderMessages();}
            }catch(e){toast('杩炴帴澶辫触');currentSession.messages.pop();renderMessages();}
            finally{document.getElementById('typingIndicator').classList.remove('show');document.getElementById('sendBtn').disabled=false;}
        }

        function quickAction(type){
            if(!currentCustomerId){toast('璇峰厛閫夋嫨瀹㈡埛');return;}
            const p={payment:'璇峰洖澶嶄拱瀹跺叧浜庝粯娆炬柟寮忕殑璇㈤棶锛屽寘鎷琓/T銆丩/C銆乀rade Assurance',shipping:'璇峰洖澶嶄拱瀹跺叧浜庣墿娴佹柟妗堢殑闂锛屾捣杩?绌鸿繍/DDP',sample:'璇峰洖澶嶄拱瀹跺叧浜庡瘎鏍风殑闂',moq:'璇峰洖澶嶄拱瀹跺叧浜庤捣璁㈤噺鐨勯棶棰橈紝棣栨鍚堜綔鍙伒娲?,oem:'璇峰洖澶嶄拱瀹跺叧浜嶰EM/ODM瀹氬埗鐨勯棶棰?};
            document.getElementById('inputArea').value=p[type]||'';document.getElementById('inputArea').focus();
        }

        function renderKBList(){
            const list=document.getElementById('kbList');
            if(!kbFiles.length){list.innerHTML='<div style="text-align:center;color:#555;font-size:11px;padding:10px;">鏆傛棤鐭ヨ瘑搴?/div>';return;}
            list.innerHTML=kbFiles.map((f,i)=>`<div class="kb-item"><span class="kname">馃搫 ${f.name}</span><span class="ksize">${(f.content.length/1024).toFixed(1)}KB</span><button class="kdel" onclick="deleteKB(${i})">鉁?/button></div>`).join('');
        }
        function showUploadKB(){document.getElementById('uploadKBModal').classList.add('show');}
        function showCreateKB(){document.getElementById('createKBModal').classList.add('show');}
        function closeModal(id){document.getElementById(id).classList.remove('show');}
        async function uploadKB(){
            const fi=document.getElementById('kbFileInput');const ci=document.getElementById('kbContentInput');const ni=document.getElementById('kbFilenameInput');
            let name=ni.value.trim(),content=ci.value.trim();
            if(fi.files.length>0){name=name||fi.files[0].name;content=await fi.files[0].text();}
            if(!name||!content){toast('璇锋彁渚涙枃浠跺悕鍜屽唴瀹?);return;}
            kbFiles.push({name,content});localStorage.setItem('kb_files',JSON.stringify(kbFiles));renderKBList();closeModal('uploadKBModal');fi.value='';ci.value='';ni.value='';toast('鐭ヨ瘑搴撳凡鏇存柊');
        }
        function createKB(){
            const n=document.getElementById('newKBName').value.trim(),c=document.getElementById('newKBContent').value.trim();
            if(!n||!c){toast('璇峰～鍐?);return;}
            kbFiles.push({name:n,content:c});localStorage.setItem('kb_files',JSON.stringify(kbFiles));renderKBList();closeModal('createKBModal');document.getElementById('newKBName').value='';document.getElementById('newKBContent').value='';toast('鏂囨。宸插垱寤?);
        }
        function deleteKB(i){if(!confirm('纭畾鍒犻櫎锛?))return;kbFiles.splice(i,1);localStorage.setItem('kb_files',JSON.stringify(kbFiles));renderKBList();}

        function copyLastReply(){const msgs=currentSession.messages.filter(m=>m.role==='assistant');if(!msgs.length){toast('娌℃湁鍙鍒剁殑鍥炲');return;}navigator.clipboard.writeText(msgs[msgs.length-1].content).then(()=>toast('宸插鍒?));}
        function esc(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
        function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
    </script>
</body>
</html>
