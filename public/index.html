<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>询盘回复助手 - 云端知识库</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
    <style>
        :root {
            --bg: #f4f8fb;
            --surface: #ffffff;
            --surface-2: #eef5f8;
            --ink: #172033;
            --muted: #65748b;
            --soft: #8a9ab0;
            --line: #d9e4ec;
            --line-strong: #c5d4df;
            --brand: #0f8ea8;
            --brand-strong: #08677d;
            --mint: #159a83;
            --gold: #b7791f;
            --danger: #c2415b;
            --shadow: 0 18px 45px rgba(33, 60, 85, 0.11);
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            height: 100vh;
            overflow: hidden;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--ink);
        }

        button, input, textarea, select { font: inherit; }
        button { cursor: pointer; }
        button:disabled { cursor: wait; opacity: 0.72; }

        .app {
            height: 100vh;
            display: grid;
            grid-template-columns: 306px minmax(0, 1fr) 392px;
            background:
                linear-gradient(180deg, rgba(236, 247, 250, 0.92), rgba(244, 248, 251, 0.98) 260px),
                var(--bg);
        }

        .side, .knowledge {
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.94);
            border-right: 1px solid var(--line);
        }

        .knowledge {
            border-right: 0;
            border-left: 1px solid var(--line);
        }

        .brand {
            padding: 20px 18px 18px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #ffffff, #f7fbfd);
        }

        .brand-row, .toolbar-row, .knowledge-title, .composer-footer, .row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-row { justify-content: space-between; }

        h1, h2, h3, p { margin-top: 0; }

        .brand h1 {
            margin-bottom: 0;
            font-size: 18px;
            line-height: 1.25;
            letter-spacing: 0;
        }

        .version {
            height: 26px;
            display: inline-flex;
            align-items: center;
            padding: 0 9px;
            border-radius: 999px;
            border: 1px solid #bee3ea;
            color: var(--brand-strong);
            background: #e8f7fa;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .brand-sub {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .section {
            padding: 15px 16px;
            border-bottom: 1px solid var(--line);
        }

        .section-title {
            margin: 0 0 10px;
            color: #415167;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .field {
            display: grid;
            gap: 6px;
            margin-bottom: 10px;
        }

        .field label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
        }

        .control, select, textarea {
            width: 100%;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: #ffffff;
            color: var(--ink);
            outline: none;
        }

        .control, select {
            height: 38px;
            padding: 0 10px;
        }

        textarea {
            padding: 12px;
            resize: none;
            line-height: 1.58;
        }

        .control:focus, select:focus, textarea:focus {
            border-color: rgba(15, 142, 168, 0.72);
            box-shadow: 0 0 0 3px rgba(15, 142, 168, 0.12);
        }

        .row { min-width: 0; }
        .row > * { min-width: 0; }

        .btn {
            height: 38px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background: #ffffff;
            color: #263449;
            padding: 0 12px;
            white-space: nowrap;
            font-weight: 650;
        }

        .btn:hover { border-color: #7cb8c5; color: var(--brand-strong); }

        .btn.primary {
            border-color: transparent;
            background: linear-gradient(135deg, #0f8ea8, #147c66);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(15, 142, 168, 0.22);
        }

        .btn.ghost {
            background: transparent;
            color: var(--muted);
        }

        .auto-panel {
            display: grid;
            gap: 8px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: #f7fbfd;
        }

        .auto-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #263449;
        }

        .auto-desc {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .intent-pill {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid #cce6dd;
            color: #0f684f;
            background: #edf9f4;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .product-switch, .skill-switch {
            display: grid;
            gap: 8px;
        }

        .product-option, .skill-option {
            width: 100%;
            display: grid;
            grid-template-columns: 10px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: #263449;
            background: #ffffff;
            text-align: left;
        }

        .skill-option { grid-template-columns: minmax(0, 1fr) auto; }

        .product-option:hover, .skill-option:hover {
            border-color: #9bcad3;
            background: #f7fbfd;
        }

        .product-option.active, .skill-option.active {
            border-color: rgba(15, 142, 168, 0.72);
            background: #eaf7fa;
            box-shadow: inset 3px 0 0 var(--brand);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--mint);
        }

        .dot.sofa { background: var(--gold); }
        .product-name, .skill-name { font-size: 13px; font-weight: 800; }
        .product-meta, .skill-meta { color: var(--muted); font-size: 11px; line-height: 1.45; }

        .skill-tag {
            color: var(--brand-strong);
            font-size: 11px;
            font-weight: 800;
        }

        .session-list {
            min-height: 0;
            overflow: auto;
            padding: 10px;
            flex: 1;
        }

        .session-item {
            width: 100%;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px;
            align-items: center;
            margin-bottom: 6px;
            padding: 10px;
            border: 1px solid transparent;
            border-radius: var(--radius);
            color: #263449;
            background: transparent;
            text-align: left;
        }

        .session-item:hover { background: #f1f7fa; }
        .session-item.active {
            border-color: #9bcad3;
            background: #eaf7fa;
        }

        .session-id {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 800;
        }

        .session-count { color: var(--muted); font-size: 11px; }
        .delete-btn {
            border: 0;
            color: var(--danger);
            background: transparent;
            font-size: 12px;
            font-weight: 800;
        }

        .main {
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.56), rgba(244, 248, 251, 0.96));
        }

        .topbar {
            min-height: 78px;
            padding: 16px 22px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
        }

        .customer-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.3;
        }

        .status-line {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        .badge {
            height: 30px;
            display: inline-flex;
            align-items: center;
            padding: 0 10px;
            border: 1px solid #bee3ea;
            border-radius: 999px;
            color: var(--brand-strong);
            background: #e8f7fa;
            font-size: 12px;
            font-weight: 750;
            white-space: nowrap;
        }

        .badge.skill {
            border-color: #cce6dd;
            color: #0f684f;
            background: #edf9f4;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 22px;
        }

        .empty-state {
            height: 100%;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }

        .empty-card {
            width: min(540px, 96%);
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow);
        }

        .empty-card strong {
            display: block;
            margin-bottom: 8px;
            color: var(--ink);
            font-size: 17px;
        }

        .message {
            width: fit-content;
            max-width: min(760px, 78%);
            margin-bottom: 14px;
        }

        .message.user { margin-left: auto; }
        .message.assistant {
            width: min(960px, 86%);
            max-width: 86%;
            margin-right: auto;
        }

        .message-label {
            margin-bottom: 5px;
            color: var(--soft);
            font-size: 11px;
            font-weight: 700;
        }

        .message.user .message-label { text-align: right; }

        .bubble {
            display: inline-block;
            padding: 13px 15px;
            border-radius: var(--radius);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.62;
            font-size: 14px;
            box-shadow: 0 8px 20px rgba(33, 60, 85, 0.08);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #0f8ea8, #147c66);
            color: #ffffff;
        }

        .message.assistant .bubble {
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--ink);
        }

        .message.analysis {
            width: min(900px, 84%);
            max-width: 84%;
            margin-right: auto;
        }

        .message.analysis .bubble {
            border: 1px solid #cce6dd;
            background: #f3fbf7;
            color: #18382f;
        }

        .composer {
            padding: 14px 20px 18px;
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.92);
        }

        .composer-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .file-btn, .chip {
            height: 30px;
            padding: 0 10px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            background: #ffffff;
            color: #415167;
            font-size: 12px;
            white-space: nowrap;
            font-weight: 650;
        }

        .chip:hover, .chip.active {
            border-color: #7cb8c5;
            background: #eaf7fa;
            color: var(--brand-strong);
        }

        .hidden-file { display: none; }

        .composer textarea {
            min-height: 58px;
            max-height: 220px;
            margin-bottom: 10px;
            overflow-y: auto;
        }

        .composer-footer {
            justify-content: space-between;
            gap: 12px;
        }

        .hint {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.45;
        }

        .knowledge-header {
            padding: 18px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #ffffff, #f7fbfd);
        }

        .knowledge-title { justify-content: space-between; }

        .knowledge-title h2 {
            margin: 0;
            font-size: 16px;
        }

        .storage-pill {
            height: 26px;
            display: inline-flex;
            align-items: center;
            padding: 0 8px;
            border-radius: 999px;
            background: #e8f7fa;
            color: var(--brand-strong);
            font-size: 11px;
            font-weight: 800;
        }

        .knowledge-desc {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .knowledge-body {
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 16px 18px;
            gap: 12px;
            flex: 1;
        }

        .knowledge-body textarea {
            flex: 1;
            min-height: 320px;
        }

        .knowledge-status {
            min-height: 18px;
            color: var(--muted);
            font-size: 12px;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 30;
            display: none;
            max-width: 380px;
            padding: 11px 13px;
            border: 1px solid #9bcad3;
            border-radius: var(--radius);
            background: #ffffff;
            color: var(--ink);
            box-shadow: var(--shadow);
            font-size: 13px;
        }

        .toast.show { display: block; }

        @media (max-width: 1180px) {
            .app { grid-template-columns: 286px minmax(0, 1fr); }
            .knowledge {
                position: fixed;
                right: 0;
                top: 0;
                bottom: 0;
                width: min(410px, 92vw);
                transform: translateX(100%);
                transition: transform 0.2s ease;
                z-index: 20;
                box-shadow: -20px 0 45px rgba(33, 60, 85, 0.14);
            }
            .knowledge.open { transform: translateX(0); }
        }

        @media (max-width: 860px) {
            body { overflow: auto; height: auto; }
            .app {
                height: auto;
                min-height: 100vh;
                grid-template-columns: 1fr;
            }
            .side, .main { min-height: 0; }
            .side { order: 1; }
            .main { order: 2; min-height: 720px; }
            .session-list { max-height: 180px; }
            .topbar, .composer-footer {
                align-items: flex-start;
                flex-direction: column;
            }
            .toolbar-row { flex-wrap: wrap; }
            .message { max-width: 96%; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="side">
            <div class="brand">
                <div class="brand-row">
                    <h1>询盘回复助手</h1>
                    <span class="version">DeepSeek V4</span>
                </div>
                <p class="brand-sub">云端产品知识库，面向雕塑产品和压缩沙发产品的业务回复工作台。</p>
            </div>

            <div class="section">
                <p class="section-title">访问</p>
                <div class="field">
                    <label for="accessToken">站点口令</label>
                    <div class="row">
                        <input class="control" type="password" id="accessToken" placeholder="输入团队口令">
                        <button class="btn" onclick="saveAccessToken()">保存</button>
                    </div>
                </div>
                <button class="btn ghost" onclick="loadKnowledge()">刷新云端知识</button>
            </div>

            <div class="section">
                <p class="section-title">产品知识分类</p>
                <div class="product-switch" id="productSwitch"></div>
            </div>

            <div class="section">
                <p class="section-title">自动识别</p>
                <div class="auto-panel">
                    <div class="auto-title">
                        <span>回复策略</span>
                        <span class="intent-pill" id="autoIntentPill">自动判断</span>
                    </div>
                    <p class="auto-desc">系统会根据询盘、对话文件和知识库自动判断报价、样品、物流、定制、跟进或异议处理。</p>
                </div>
            </div>

            <div class="section">
                <p class="section-title">客户会话</p>
                <div class="row">
                    <input class="control" id="customerIdInput" placeholder="客户ID，如 dubai-001">
                    <button class="btn primary" onclick="switchSession()">进入</button>
                </div>
                <button class="btn ghost" style="width:100%; margin-top:8px;" onclick="createNewSession()">新建会话</button>
            </div>

            <div class="session-list" id="sessionList"></div>

            <div class="section">
                <p class="section-title">回复设置</p>
                <div class="field">
                    <label for="platform">平台</label>
                    <select id="platform">
                        <option value="alibaba">阿里巴巴国际站</option>
                        <option value="mic">中国制造网</option>
                        <option value="1688">1688</option>
                    </select>
                </div>
                <div class="row">
                    <select id="replyLang" title="回复语言">
                        <option value="en">English</option>
                        <option value="es">Español</option>
                        <option value="ru">Русский</option>
                        <option value="ar">العربية</option>
                        <option value="pt">Português</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="tr">Türkçe</option>
                    </select>
                    <select id="tone" title="语气">
                        <option value="professional">专业</option>
                        <option value="friendly">热情</option>
                        <option value="concise">简洁</option>
                    </select>
                </div>
                <div class="row" style="margin-top:8px;">
                    <select id="modelSelect" title="模型">
                        <option value="flash">V4-Flash</option>
                        <option value="pro">V4-Pro</option>
                    </select>
                    <input class="control" id="priceRange" placeholder="参考价，可选">
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h2 class="customer-title" id="currentCustomerLabel">未选择客户</h2>
                    <div class="status-line" id="statusLine">选择产品知识分类和回复技能后开始回复。</div>
                </div>
                <div class="toolbar-row">
                    <span class="badge" id="activeProductBadge">雕塑产品</span>
                    <span class="badge skill" id="activeSkillBadge">自动识别</span>
                    <button class="btn" onclick="copyLastReply()">复制回复</button>
                    <button class="btn" onclick="clearCurrentSession()">清除会话</button>
                    <button class="btn" onclick="toggleKnowledgePanel()">知识库</button>
                </div>
            </header>

            <section class="messages" id="messagesArea"></section>

            <footer class="composer">
                <div class="composer-tools">
                    <label class="file-btn" for="conversationFile">上传对话文档</label>
                    <input class="hidden-file" id="conversationFile" type="file" accept=".txt,.csv,.xlsx,.xls" onchange="handleConversationFile(event)">
                    <span class="hint" id="fileHint">支持 TXT、CSV、Excel；文件只绑定当前客户ID</span>
                </div>
                <textarea id="inputArea" placeholder="粘贴买家最新问题，或先上传对话文档后直接生成回复" oninput="handleInputChange()" onkeydown="handleKeydown(event)"></textarea>
                <div class="composer-footer">
                    <span class="hint" id="composerHint">当前使用：雕塑产品知识库 · 自动识别回复策略</span>
                    <button class="btn primary" id="sendBtn" onclick="sendMessage()">生成回复</button>
                </div>
            </footer>
        </main>

        <aside class="knowledge" id="knowledgePanel">
            <div class="knowledge-header">
                <div class="knowledge-title">
                    <h2 id="knowledgeTitle">雕塑产品知识库</h2>
                    <span class="storage-pill" id="storagePill">读取中</span>
                </div>
                <p class="knowledge-desc" id="knowledgeDesc">维护当前产品的回复依据，保存后团队电脑都会使用同一份数据。</p>
            </div>
            <div class="knowledge-body">
                <textarea id="knowledgeEditor" placeholder="填写产品范围、材质、规格、报价口径、FAQ、交期、包装、认证、常见追问等。"></textarea>
                <div class="knowledge-status" id="knowledgeStatus"></div>
                <div class="row">
                    <button class="btn primary" onclick="saveKnowledge()">保存到云端</button>
                    <button class="btn" onclick="loadKnowledge()">重新读取</button>
                </div>
            </div>
        </aside>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const PRODUCTS = {
            sculpture: {
                id: 'sculpture',
                name: '雕塑产品',
                shortName: '雕塑',
                meta: '景观装置 / 艺术摆件 / 工程定制',
                description: '用于回复雕塑、景观装置、艺术摆件、不锈钢/玻璃钢/铸铜工程定制类询盘。'
            },
            'compressed-sofa': {
                id: 'compressed-sofa',
                name: '压缩沙发产品',
                shortName: '压缩沙发',
                meta: '卷包家具 / 跨境电商 / OEM',
                description: '用于回复压缩沙发、卷包沙发、跨境家具、电商包装、OEM/ODM 类询盘。'
            }
        };

        const REPLY_SKILLS = {
            quote: {
                id: 'quote',
                name: '报价确认',
                shortName: '报价',
                meta: '价格 / MOQ / 规格确认',
                template: '请根据当前产品知识库，回复买家关于价格、MOQ、规格确认和下一步报价资料的问题。'
            },
            sample: {
                id: 'sample',
                name: '样品推进',
                shortName: '样品',
                meta: '样品费 / 寄送 / 大货衔接',
                template: '请回复买家关于样品、样品费、寄送方式、样品周期和后续大货订单的询问。'
            },
            logistics: {
                id: 'logistics',
                name: '包装物流',
                shortName: '物流',
                meta: '包装 / 交期 / 贸易条款',
                template: '请回复买家关于包装方式、运输方式、交期、装柜量和贸易条款的问题。'
            },
            custom: {
                id: 'custom',
                name: '定制项目',
                shortName: '定制',
                meta: '尺寸 / 颜色 / OEM / 项目图纸',
                template: '请回复买家关于定制、颜色、尺寸、LOGO、设计图纸或项目方案的问题。'
            },
            followup: {
                id: 'followup',
                name: '跟进唤醒',
                shortName: '跟进',
                meta: '未回复 / 二次确认 / 推进成交',
                template: '请写一封简短跟进回复，礼貌提醒买家确认规格、数量、收货国家和下一步需求。'
            },
            objection: {
                id: 'objection',
                name: '异议处理',
                shortName: '异议',
                meta: '价格疑虑 / 犹豫 / 缺少信息',
                template: '请针对买家的价格疑虑、犹豫或信息不完整，写一段专业但不过度承诺的回复。'
            }
        };

        const ACCESS_TOKEN_KEY = 'inquiry_access_token';
        const ACTIVE_CATEGORY_KEY = 'inquiry_active_category';
        const SESSION_KEY = 'inquiry_sessions_v3';

        let activeCategory = localStorage.getItem(ACTIVE_CATEGORY_KEY) || 'sculpture';
        let activeSkill = 'auto';
        let currentCustomerId = '';
        let currentSession = { messages: [], documentContext: '' };
        let knowledgeProfiles = {};
        let storageMode = 'loading';
        let knowledgeDirty = false;

        init();

        function init() {
            document.getElementById('accessToken').value = localStorage.getItem(ACCESS_TOKEN_KEY) || '';
            renderProductSwitch();
            renderSessionList();
            renderMessages();
            autoResizeInput();
            loadKnowledge();
        }

        function apiHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            const token = (localStorage.getItem(ACCESS_TOKEN_KEY) || '').trim();
            if (token) headers['X-App-Token'] = token;
            return headers;
        }

        function saveAccessToken() {
            const token = document.getElementById('accessToken').value.trim();
            if (token) localStorage.setItem(ACCESS_TOKEN_KEY, token);
            else localStorage.removeItem(ACCESS_TOKEN_KEY);
            toast('口令已保存');
            loadKnowledge();
        }

        function product(id = activeCategory) {
            return PRODUCTS[id] || PRODUCTS.sculpture;
        }

        function skill(id = activeSkill) {
            return REPLY_SKILLS[id] || REPLY_SKILLS.quote;
        }

        function currentProfile() {
            return knowledgeProfiles[activeCategory] || product(activeCategory);
        }

        function renderProductSwitch() {
            const wrap = document.getElementById('productSwitch');
            wrap.innerHTML = Object.values(PRODUCTS).map(item => `
                <button class="product-option ${item.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${item.id}')">
                    <span class="dot ${item.id === 'compressed-sofa' ? 'sofa' : ''}"></span>
                    <span>
                        <span class="product-name">${esc(item.name)}</span><br>
                        <span class="product-meta">${esc(item.meta)}</span>
                    </span>
                    <span class="product-meta">${item.id === activeCategory ? '使用中' : ''}</span>
                </button>
            `).join('');
            syncHeader();
        }

        function syncHeader() {
            const activeProduct = product();
            const detectedSkill = detectReplySkill(document.getElementById('inputArea')?.value || '');
            const activeSkillItem = skill(detectedSkill);
            document.getElementById('activeProductBadge').textContent = activeProduct.name;
            document.getElementById('activeSkillBadge').textContent = '自动识别：' + activeSkillItem.name;
            document.getElementById('autoIntentPill').textContent = activeSkillItem.name;
            document.getElementById('composerHint').textContent = `当前使用：${activeProduct.name}知识库 · 自动识别为 ${activeSkillItem.name}`;
            document.getElementById('knowledgeTitle').textContent = activeProduct.name + '知识库';
            document.getElementById('knowledgeDesc').textContent = activeProduct.description;
            updateStatusLine();
        }

        function selectCategory(id) {
            if (!PRODUCTS[id]) return;
            if (knowledgeDirty && !confirm('当前知识库内容还没有保存，确定切换吗？')) return;
            activeCategory = id;
            localStorage.setItem(ACTIVE_CATEGORY_KEY, id);
            knowledgeDirty = false;
            renderProductSwitch();
            renderKnowledgeEditor();
        }

        function detectReplySkill(text = '') {
            const source = `${text}\n${currentSession.documentContext || ''}`.toLowerCase();
            if (/sample|样品|sample fee|courier|寄样|样板/.test(source)) return 'sample';
            if (/ship|shipping|freight|forwarder|delivery|lead time|package|packing|carton|物流|运费|交期|包装|装柜/.test(source)) return 'logistics';
            if (/custom|oem|odm|logo|color|size|drawing|design|定制|尺寸|颜色|图纸|方案/.test(source)) return 'custom';
            if (/too expensive|expensive|cheaper|discount|target price|贵|便宜|折扣|太高/.test(source)) return 'objection';
            if (/follow up|decision|update|waiting|remind|回复了吗|跟进|决定/.test(source)) return 'followup';
            return 'quote';
        }

        async function loadKnowledge() {
            setKnowledgeStatus('正在读取云端知识库...');
            try {
                const res = await fetch('/api/knowledge', { headers: apiHeaders() });
                const data = await res.json().catch(() => ({}));
                if (res.status === 401) {
                    setKnowledgeStatus('需要填写正确站点口令后读取。');
                    document.getElementById('storagePill').textContent = '需要口令';
                    return;
                }
                if (!res.ok) throw new Error(data.error || '读取失败');
                knowledgeProfiles = data.profiles || {};
                storageMode = data.storage || 'cloud';
                knowledgeDirty = false;
                renderProductSwitch();
                renderKnowledgeEditor();
                setKnowledgeStatus('云端知识库已同步');
                document.getElementById('storagePill').textContent = storageMode === 'netlify-blobs' ? '云端' : '本地调试';
            } catch (error) {
                setKnowledgeStatus('读取失败：' + error.message);
                document.getElementById('storagePill').textContent = '离线';
            }
        }

        async function saveKnowledge() {
            const content = document.getElementById('knowledgeEditor').value.trim();
            if (!content) { toast('知识库内容不能为空'); return; }
            if (content.length > 24000) { toast('知识库内容不能超过 24000 字符'); return; }

            setKnowledgeStatus('正在保存...');
            try {
                const res = await fetch('/api/knowledge', {
                    method: 'PUT',
                    headers: apiHeaders(),
                    body: JSON.stringify({ category: activeCategory, content })
                });
                const data = await res.json().catch(() => ({}));
                if (res.status === 401) throw new Error('口令错误或未填写');
                if (!res.ok) throw new Error(data.error || '保存失败');
                knowledgeProfiles = data.profiles || {};
                storageMode = data.storage || storageMode;
                knowledgeDirty = false;
                renderKnowledgeEditor();
                setKnowledgeStatus('已保存，团队电脑会读取同一份知识库。');
                toast('知识库已保存');
            } catch (error) {
                setKnowledgeStatus('保存失败：' + error.message);
            }
        }

        function renderKnowledgeEditor() {
            const profile = currentProfile();
            document.getElementById('knowledgeEditor').value = profile.content || '';
            document.getElementById('knowledgeEditor').oninput = () => {
                knowledgeDirty = true;
                setKnowledgeStatus('有未保存修改');
            };
            const updatedAt = profile.updatedAt ? new Date(profile.updatedAt).toLocaleString() : '尚未保存';
            setKnowledgeStatus(`最后更新：${updatedAt}`);
            syncHeader();
        }

        function setKnowledgeStatus(text) {
            document.getElementById('knowledgeStatus').textContent = text;
        }

        function getSessions() {
            return JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
        }

        function saveSessions(sessions) {
            localStorage.setItem(SESSION_KEY, JSON.stringify(sessions));
        }

        function isValidCustomerId(id) {
            return /^[a-zA-Z0-9_-]{1,80}$/.test(id);
        }

        function createNewSession() {
            const id = document.getElementById('customerIdInput').value.trim();
            if (!id) {
                toast('请先输入明确的客户ID，系统只会保存这个ID的数据');
                return;
            }
            switchToSession(id);
        }

        function switchSession() {
            const id = document.getElementById('customerIdInput').value.trim();
            if (!id) { toast('请输入客户ID'); return; }
            switchToSession(id);
        }

        function requireActiveCustomer() {
            if (currentCustomerId) return true;
            toast('请先输入客户ID并点击进入，避免会话串到别的客户');
            return false;
        }

        function switchToSession(id) {
            if (!isValidCustomerId(id)) {
                toast('客户ID只能包含字母、数字、下划线和短横线');
                return;
            }
            currentCustomerId = id;
            document.getElementById('customerIdInput').value = id;
            document.getElementById('currentCustomerLabel').textContent = id;
            const sessions = getSessions();
            currentSession = sessions[id] || { messages: [], documentContext: '' };
            currentSession.messages = currentSession.messages || [];
            currentSession.documentContext = currentSession.documentContext || '';
            document.getElementById('fileHint').textContent = currentSession.documentContext
                ? '当前客户已绑定对话文档'
                : '支持 TXT、CSV、Excel；文件只绑定当前客户ID';
            renderSessionList();
            renderMessages();
            updateStatusLine();
        }

        function renderSessionList() {
            const sessions = getSessions();
            const ids = Object.keys(sessions).filter(isValidCustomerId);
            const list = document.getElementById('sessionList');
            if (!ids.length) {
                list.innerHTML = '<div class="hint" style="padding:12px;">暂无会话</div>';
                return;
            }
            list.innerHTML = ids.map(id => `
                <button class="session-item ${id === currentCustomerId ? 'active' : ''}" onclick="switchToSession('${id}')">
                    <span>
                        <span class="session-id">${esc(id)}</span><br>
                        <span class="session-count">${(sessions[id].messages || []).length} 条消息</span>
                    </span>
                    <span class="delete-btn" onclick="event.stopPropagation(); deleteSession('${id}')">删除</span>
                </button>
            `).join('');
        }

        function deleteSession(id) {
            if (!confirm('确定删除这个客户会话？')) return;
            const sessions = getSessions();
            delete sessions[id];
            saveSessions(sessions);
            if (id === currentCustomerId) {
                currentCustomerId = '';
                currentSession = { messages: [], documentContext: '' };
                document.getElementById('currentCustomerLabel').textContent = '未选择客户';
                document.getElementById('fileHint').textContent = '支持 TXT、CSV、Excel；文件只绑定当前客户ID';
            }
            renderSessionList();
            renderMessages();
            updateStatusLine();
        }

        function clearCurrentSession() {
            if (!currentCustomerId) { toast('请先选择客户'); return; }
            deleteSession(currentCustomerId);
        }

        function renderMessages() {
            const area = document.getElementById('messagesArea');
            if (!currentSession.messages.length) {
                area.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-card">
                            <strong>粘贴买家询盘即可生成回复</strong>
                            <span>先进入客户ID，系统会按当前客户ID保存对话和上传文档；回复策略会自动识别。</span>
                        </div>
                    </div>
                `;
                return;
            }
            area.innerHTML = currentSession.messages.map(message => `
                <div class="message ${message.role}">
                    <div class="message-label">${messageLabel(message)}</div>
                    <div class="bubble">${esc(message.content)}</div>
                </div>
            `).join('');
            area.scrollTop = area.scrollHeight;
        }

        function messageLabel(message) {
            if (message.role === 'user') return '买家询盘';
            if (message.role === 'analysis') return '对话分析';
            return `AI回复${message.skill ? ' · ' + esc(skill(message.skill).name) : ''}`;
        }

        async function sendMessage() {
            const input = document.getElementById('inputArea');
            const text = input.value.trim();
            if (!requireActiveCustomer()) return;
            if (!text && !currentSession.documentContext) {
                toast('请输入买家问题，或先上传对话文档');
                return;
            }

            const detectedSkill = detectReplySkill(text);
            const inquiryText = text || 'Please analyze the uploaded conversation and write the best next reply to the latest buyer message.';
            if (text) {
                currentSession.messages.push({ role: 'user', content: text, skill: detectedSkill });
            }
            renderMessages();
            input.value = '';
            autoResizeInput();
            setSending(true);

            try {
                const unsavedKnowledge = knowledgeDirty ? document.getElementById('knowledgeEditor').value.trim() : '';
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: apiHeaders(),
                    body: JSON.stringify({
                        customerId: currentCustomerId,
                        inquiry: inquiryText,
                        platform: document.getElementById('platform').value,
                        lang: document.getElementById('replyLang').value,
                        tone: document.getElementById('tone').value,
                        priceRange: document.getElementById('priceRange').value,
                        model: document.getElementById('modelSelect').value,
                        knowledgeCategory: activeCategory,
                        replySkill: 'auto',
                        knowledgeBase: unsavedKnowledge,
                        conversationContext: currentSession.documentContext || ''
                    })
                });
                const data = await res.json().catch(() => ({ error: '服务返回异常' }));
                if (res.status === 401) throw new Error('口令错误或未填写');
                if (!res.ok) throw new Error(data.error || '生成失败');

                currentSession.messages.push({ role: 'assistant', content: data.reply, skill: data.replySkill || detectedSkill });
                const sessions = getSessions();
                sessions[currentCustomerId] = currentSession;
                saveSessions(sessions);
                renderMessages();
                renderSessionList();
                updateStatusLine();
            } catch (error) {
                if (text) currentSession.messages.pop();
                renderMessages();
                toast('生成失败：' + error.message);
            } finally {
                setSending(false);
            }
        }

        function handleInputChange() {
            activeSkill = detectReplySkill(document.getElementById('inputArea').value);
            syncHeader();
            autoResizeInput();
        }

        function autoResizeInput() {
            const input = document.getElementById('inputArea');
            if (!input) return;
            input.style.height = 'auto';
            input.style.height = Math.min(220, Math.max(58, input.scrollHeight)) + 'px';
        }

        async function handleConversationFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            if (!requireActiveCustomer()) {
                event.target.value = '';
                return;
            }
            if (file.size > 2 * 1024 * 1024) {
                toast('对话文档请控制在 2MB 内，避免浏览器存储过大');
                event.target.value = '';
                return;
            }

            try {
                document.getElementById('fileHint').textContent = '正在分析对话文档...';
                const rawText = await readConversationFile(file);
                const analysis = analyzeConversationText(rawText, file.name);
                currentSession.documentContext = analysis.context;
                currentSession.documentName = file.name;
                currentSession.messages.push({ role: 'analysis', content: analysis.summary });

                const sessions = getSessions();
                sessions[currentCustomerId] = currentSession;
                saveSessions(sessions);
                document.getElementById('fileHint').textContent = `已绑定：${file.name}`;
                activeSkill = analysis.skill;
                if (analysis.category && analysis.category !== activeCategory) {
                    activeCategory = analysis.category;
                    localStorage.setItem(ACTIVE_CATEGORY_KEY, activeCategory);
                    renderProductSwitch();
                    renderKnowledgeEditor();
                }
                renderMessages();
                renderSessionList();
                syncHeader();
                toast('对话文档已分析并绑定到当前客户ID');
            } catch (error) {
                document.getElementById('fileHint').textContent = '文件分析失败';
                toast('文件分析失败：' + error.message);
            } finally {
                event.target.value = '';
            }
        }

        function readConversationFile(file) {
            const lowerName = file.name.toLowerCase();
            if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) {
                return readExcelConversation(file);
            }
            return file.text();
        }

        function readExcelConversation(file) {
            return new Promise((resolve, reject) => {
                if (!window.XLSX) {
                    reject(new Error('Excel 解析库还没有加载完成，请几秒后重试'));
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const workbook = window.XLSX.read(reader.result, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = window.XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                        resolve(rowsToConversationText(rows));
                    } catch (error) {
                        reject(error);
                    }
                };
                reader.onerror = () => reject(new Error('无法读取文件'));
                reader.readAsArrayBuffer(file);
            });
        }

        function rowsToConversationText(rows) {
            if (!rows.length) return '';
            const headers = rows[0].map(item => String(item || '').trim());
            const lines = [];
            rows.slice(1).forEach((row, index) => {
                const values = row.map(item => String(item || '').trim());
                if (!values.some(Boolean)) return;
                const record = {};
                headers.forEach((header, colIndex) => {
                    if (header) record[header] = values[colIndex] || '';
                });
                const time = record['发送时间'] || record['时间'] || record['Time'] || values[0] || '';
                const sender = record['发送者'] || record['Sender'] || values[1] || '';
                const role = record['角色'] || record['Role'] || values[2] || '';
                const type = record['消息类型'] || record['Type'] || values[3] || '';
                const content = record['内容/链接'] || record['内容'] || record['Message'] || values[4] || values.filter(Boolean).join(' ');
                lines.push(`[${index + 1}] 时间:${time} 发送者:${sender} 角色:${role} 类型:${type} 内容:${content}`);
            });
            return lines.join('\n');
        }

        function analyzeConversationText(rawText, fileName) {
            const cleanText = String(rawText || '').replace(/\r/g, '').trim();
            if (!cleanText) throw new Error('文件里没有可分析的文本内容');
            const lines = cleanText.split('\n').map(line => line.trim()).filter(Boolean);
            const buyerLines = lines.filter(line => /角色[:：]?\s*买家|buyer|客户/i.test(line));
            const sellerLines = lines.filter(line => /角色[:：]?\s*卖家|seller|系统自动接待|自动回复/i.test(line));
            const latestBuyerLine = [...buyerLines].reverse()[0] || [...lines].reverse().find(line => !/系统自动接待|seller|卖家/i.test(line)) || lines[lines.length - 1];
            const unreadCount = lines.filter(line => /未读/.test(line)).length;
            const autoReplyCount = lines.filter(line => /系统自动接待|自动回复/.test(line)).length;
            const skillId = detectReplySkill(`${latestBuyerLine}\n${cleanText}`);
            const category = /sofa|mattress|compressed|vacuum|沙发|床垫|压缩/i.test(cleanText)
                ? 'compressed-sofa'
                : /sculpture|statue|stainless|fiberglass|bronze|雕塑|景观/i.test(cleanText)
                    ? 'sculpture'
                    : '';
            const summary = [
                `已分析文件：${fileName}`,
                `客户ID：${currentCustomerId}`,
                `消息行数：${lines.length}；买家消息：${buyerLines.length || '未识别'}；卖家/自动回复：${sellerLines.length || '未识别'}；未读标记：${unreadCount}。`,
                `最新买家问题：${compactLine(latestBuyerLine, 360)}`,
                `系统判断回复策略：${skill(skillId).name}${category ? `；产品分类：${product(category).name}` : ''}`,
                '下一步：可以直接点“生成回复”，也可以在输入框补充你的要求后再生成。'
            ].join('\n');
            const context = [
                `Uploaded conversation file: ${fileName}`,
                `Customer ID: ${currentCustomerId}`,
                `Detected latest buyer message: ${latestBuyerLine}`,
                `Detected reply skill: ${skill(skillId).name}`,
                `Conversation transcript:`,
                cleanText
            ].join('\n').slice(-16000);
            return { summary, context, skill: skillId, category };
        }

        function compactLine(value, limit) {
            const text = String(value || '').replace(/\s+/g, ' ').trim();
            return text.length > limit ? text.slice(0, limit - 1) + '...' : text;
        }

        function setSending(isSending) {
            const btn = document.getElementById('sendBtn');
            btn.disabled = isSending;
            btn.textContent = isSending ? '生成中...' : '生成回复';
        }

        function handleKeydown(event) {
            if (event.key === 'Enter' && event.ctrlKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function copyLastReply() {
            const replies = currentSession.messages.filter(item => item.role === 'assistant');
            if (!replies.length) { toast('暂无可复制回复'); return; }
            navigator.clipboard.writeText(replies[replies.length - 1].content).then(() => toast('已复制'));
        }

        function updateStatusLine() {
            const count = currentSession.messages.length;
            const storageText = storageMode === 'netlify-blobs' ? '云端知识库' : storageMode === 'loading' ? '读取中' : '本地调试';
            const docText = currentSession.documentContext ? '已绑定对话文档' : '未上传对话文档';
            document.getElementById('statusLine').textContent = `${product().name} · 自动识别 · ${count} 条消息 · ${docText} · ${storageText}`;
        }

        function toggleKnowledgePanel() {
            document.getElementById('knowledgePanel').classList.toggle('open');
        }

        function esc(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function toast(message) {
            const node = document.getElementById('toast');
            node.textContent = message;
            node.classList.add('show');
            setTimeout(() => node.classList.remove('show'), 2600);
        }
    </script>
</body>
</html>
